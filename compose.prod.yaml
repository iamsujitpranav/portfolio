# Production stack for sujitpranavreddy.dev.
#
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# The VPS this deploys to already runs other sites, and a shared Caddy
# container owns :80 and :443 for them. So this stack does NOT terminate TLS
# and does NOT touch those ports: it publishes exactly one port (61991) and
# Caddy reverse-proxies the domain to it. Nothing else here is published —
# Postgres and the two app containers live on internal Docker networks.
#
# Day-to-day deploys go through scripts/deploy.sh, which wraps this file with a
# DB backup, a health check and an automatic rollback. See DEPLOY.md.

name: sujit-portfolio-prod

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-portfolio}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EMBED_DIM: ${EMBED_DIM:-1024}
  VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-3}
  OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-contact@sujitpranavreddy.dev}
  # Same-origin behind nginx, so this only matters for a stray cross-origin
  # caller — keep it to the real site.
  CORS_ORIGINS: ${CORS_ORIGINS:-https://sujitpranavreddy.dev}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  SESSION_SECRET: ${SESSION_SECRET:-}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
  ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-1}
  ADMIN_SESSION_EPOCH: ${ADMIN_SESSION_EPOCH:-1}
  ADMIN_TOKEN_TTL: ${ADMIN_TOKEN_TTL:-604800}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
  CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-12/300, 60/3600}
  CONTACT_RATE_LIMIT: ${CONTACT_RATE_LIMIT:-3/600, 10/86400}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/900, 20/86400}
  # Correct here: the gateway below overwrites X-Real-IP with the real socket
  # address, so a client can't forge its way around the per-IP budgets.
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
  CHAT_MAX_MESSAGE_CHARS: ${CHAT_MAX_MESSAGE_CHARS:-2000}
  CHAT_MAX_TOTAL_CHARS: ${CHAT_MAX_TOTAL_CHARS:-12000}
  CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-400}
  CHAT_PROMPT_CACHE: ${CHAT_PROMPT_CACHE:-1}
  CHAT_GUARD_ENABLED: ${CHAT_GUARD_ENABLED:-1}
  CHAT_CACHE_ENABLED: ${CHAT_CACHE_ENABLED:-1}
  CHAT_CACHE_SIZE: ${CHAT_CACHE_SIZE:-256}
  CHAT_CACHE_TTL: ${CHAT_CACHE_TTL:-86400}
  ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-1}
  LEAD_RETENTION_DAYS: ${LEAD_RETENTION_DAYS:-730}
  ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-90}
  ANALYTICS_QUESTIONS: ${ANALYTICS_QUESTIONS:-0}

services:
  gateway:
    image: nginx:1.28-alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    ports:
      # The stack's ONLY published port. APP_BIND decides who can reach it:
      #   172.17.0.1 — Caddy can reach it while the internet cannot.
      #   0.0.0.0    — also reachable at http://<server-ip>:61991 (handy before
      #                DNS moves; plain HTTP, so it bypasses Caddy's TLS)
      - "${APP_BIND:-172.17.0.1}:${APP_PORT:-61991}:80"
    volumes:
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked in at build time — a change here needs a rebuild, not a
        # restart. scripts/deploy.sh always rebuilds.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sujitpranavreddy.dev}
        NEXT_PUBLIC_UMAMI_SRC: ${NEXT_PUBLIC_UMAMI_SRC:-}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
        NEXT_PUBLIC_AVATAR_URL: ${NEXT_PUBLIC_AVATAR_URL:-}
        NEXT_PUBLIC_ANIMATIONS_URL: ${NEXT_PUBLIC_ANIMATIONS_URL:-}
        NEXT_PUBLIC_AVATAR_FALLBACK: ${NEXT_PUBLIC_AVATAR_FALLBACK:-}
    restart: unless-stopped
    init: true
    environment:
      # Server Components read the blog straight from FastAPI, bypassing the
      # /api rewrite.
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(\"http://127.0.0.1:61991/\").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health\", timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app
      - database

  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    volumes:
      - portfolio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # `internal: true` on this network means Postgres has no route off the
    # host, published port or not.
    networks:
      - database

  # One-shot: rebuild the pgvector index over the résumé + articles.
  #   docker compose -f compose.prod.yaml --env-file .env.prod \
  #     --profile tools run --rm ingest
  ingest:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    command: ["python", "-m", "app.ingest"]
    depends_on:
      db:
        condition: service_healthy
    # Both networks: `database` to write the vectors, `app` for the route off
    # the host — the embeddings come from Voyage/OpenAI over the internet, and
    # `database` is internal-only.
    networks:
      - app
      - database

volumes:
  portfolio_pgdata:

networks:
  app:
  database:
    internal: true
