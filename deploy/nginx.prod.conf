# Application edge for the production stack, mounted into the `gateway`
# container at /etc/nginx/conf.d/default.conf (i.e. INSIDE the stock http{}
# block — which is why the limit_req_zone lines below are legal here).
#
# TLS is NOT terminated here. On the target VPS the public edge is a shared
# Caddy container that already owns :80/:443 for the other sites on the box;
# it terminates TLS for sujitpranavreddy.dev and reverse-proxies to this
# stack's single published port (61991). This file is what routes /api to
# FastAPI, everything else to Next.js, and applies the per-IP limits.

# --- Real client IP ---------------------------------------------------------
# Caddy is the only thing that should be reaching this port, and it arrives
# over a Docker bridge, so $remote_addr here is a 172.x gateway address —
# useless as an identity, and it would collapse every visitor into ONE rate
# limit bucket. Take the address from Caddy's X-Forwarded-For instead.
#
# Only addresses inside the Docker ranges are trusted to have set that header:
# a client hitting the published port directly comes from a public address,
# which is not trusted, so its forged X-Forwarded-For is ignored and its real
# socket address is what gets rate-limited.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Pass Caddy's notion of the scheme through, so the backend builds https:// URLs
# for a TLS visitor. Falls back to the scheme this server actually spoke, for a
# request that arrived on the published port without going through Caddy.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# --- Per-IP rate-limit zones ------------------------------------------------
# The app keeps its own per-IP budgets (backend/app/ratelimit.py), but those
# counters live per gunicorn worker. These zones sit in front of every worker,
# so they are the real ceiling — deliberately looser than the app limits, since
# the app returns the friendly 429 and this is just the blunt backstop.
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_contact:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_all:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_rl:10m;
limit_req_status 429;
limit_conn_status 429;

# Slowloris: a client that trickles its request line or body gets cut off
# instead of pinning a worker connection.
client_header_timeout 10s;
client_body_timeout   15s;
client_max_body_size  2m;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

server {
    listen 80 default_server;
    server_name _;

    # Sent from here rather than left to Caddy so they survive a change of
    # edge. HSTS is deliberately NOT set here — this server also answers plain
    # HTTP on the published port, and only the TLS terminator can honestly
    # promise HTTPS-only.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # Nothing on this site needs a camera, mic or location; deny by default so
    # an injected script can't prompt for them either.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # --- Claude chat: the most expensive endpoint to have abused ---
    location = /api/chat {
        limit_req  zone=api_chat burst=5 nodelay;
        limit_conn conn_rl 40;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Streamed answer — flush tokens as they arrive instead of buffering
        # the whole reply.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- Contact form: spam backstop ---
    location = /api/contact {
        limit_req  zone=api_contact burst=3 nodelay;
        limit_conn conn_rl 40;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # --- Admin login: password brute-force backstop ---
    location = /api/admin/login {
        limit_req  zone=api_login burst=5 nodelay;
        limit_conn conn_rl 40;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # --- FastAPI: everything else under /api ---
    # NOTE: declaring any proxy_set_header in a location drops every one
    # inherited from an outer scope, which is why each block above repeats the
    # full set. Without X-Real-IP the backend sees this container's peer
    # address and every per-IP budget in ratelimit.py collapses into one bucket.
    location /api/ {
        limit_req  zone=api_all burst=60 nodelay;
        limit_conn conn_rl 40;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- Next.js build output: content-hashed, cache forever ---
    location /_next/static/ {
        proxy_pass http://frontend:61991;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- The 3D journey's assets: big, versioned by deploy, rarely changed ---
    # A visitor who opens the world pulls an avatar plus several animation
    # clips; a week of browser cache keeps a repeat visit from re-downloading
    # tens of megabytes.
    location ~* ^/(models|bgm)/ {
        proxy_pass http://frontend:61991;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800";
    }

    # --- Everything else: the Next.js server ---
    location / {
        limit_req  zone=api_all burst=100 nodelay;
        limit_conn conn_rl 40;
        proxy_pass http://frontend:61991;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
