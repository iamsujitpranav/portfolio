# Nginx site config for the PM2 deployment path (host nginx + host Postgres,
# no Docker). The supported production path is the Docker stack — see
# DEPLOY.md and deploy/nginx.prod.conf.template; this file is kept for a
# bare-metal VPS install.
#
# Place at /etc/nginx/sites-available/portfolio and symlink into sites-enabled,
# then run certbot to add TLS (it will rewrite/extend this file).
#
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sujitpranavreddy.dev -d www.sujitpranavreddy.dev

# --- Per-IP rate-limit zones (must live at http{} scope) ------------------
# The app enforces its own per-IP budgets (backend/app/ratelimit.py), but those
# counters are per gunicorn worker. These zones sit in front of every worker, so
# they are the real ceiling. Keep them a little looser than the app limits —
# nginx is the blunt backstop, the app returns the friendly 429.
# If this file is included from a site config, move these three lines into
# /etc/nginx/nginx.conf inside the http{} block instead.
limit_req_zone $binary_remote_addr zone=api_chat:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=api_contact:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name sujitpranavreddy.dev www.sujitpranavreddy.dev;

    # --- Claude chat: the most expensive endpoint to have abused ---
    location = /api/chat {
        limit_req zone=api_chat burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- Contact form: spam backstop ---
    location = /api/contact {
        limit_req zone=api_contact burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Admin login: password brute-force backstop ---
    location = /api/admin/login {
        limit_req zone=api_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- FastAPI (Python) backend: everything else ---
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for the streamed Claude chat — flush tokens as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # --- Next.js static assets: long cache ---
    location /_next/static/ {
        proxy_pass http://127.0.0.1:61991;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Everything else: Next.js Node server ---
    location / {
        proxy_pass http://127.0.0.1:61991;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
